<text x="170" y="862" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-style="italic" fill="#8e9ad6">Mindgates Softtech Solutions Private Limited</text><text x="170" y="898" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#19d3c5">▸ </tspan>Built ASP.NET, PHP and MySQL applications for clients and academia</text><text x="170" y="924" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#19d3c5">▸ </tspan>Built a PHP + MySQL student management system, cutting manual processing by 50%</text></g></svg>