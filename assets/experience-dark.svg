<text x="1136" y="46" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#7c5cff" letter-spacing="1">Feb 2026 – Sep 2026</text>
<text x="170" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">React Developer and DevOps Engineer</text>
<text x="170" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-style="italic" fill="#8e9ad6">Specbee Consulting</text><text x="170" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#7c5cff">▸ </tspan>Re-engineered a CMS site into decoupled Drupal 10/11 + Next.js (App Router, SSR)</text><text x="170" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#7c5cff">▸ </tspan>Secured API calls with OIDC; improved Core Web Vitals (LCP, CLS, INP)</text><text x="170" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#7c5cff">▸ </tspan>Cut build and deploy times 20% with Azure DevOps and GitHub Actions</text><text x="170" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#7c5cff">▸ </tspan>Containerized microservices with Docker for 3 teams, deployed on AWS EKS</text></g><g class="it" style="animation-delay:0.3s"><circle class="pulse" cx="86" cy="268" r="9" fill="#19d3c5"/><circle cx="86" cy="268" r="16" fill="#19d3c5" fill-opacity=".18" class="halo"/>
<rect x="130" y="240" width="1030" height="200" rx="20" fill="#111a3a" stroke="#19d3c5" stroke-opacity="0.35"/>
<text x="1136" y="268" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#19d3c5" letter-spacing="1">Dec 2024 – Feb 2026</text>
<text x="170" y="274" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Frontend Developer and DevOps Engineer</text>
<text x="170" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-style="italic" fill="#8e9ad6">Learntastic (formerly American Healthcare Academy)</text><text x="170" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#19d3c5">▸ </tspan>Led migration from CodeIgniter PHP to Laravel Blade and Tailwind CSS</text><text x="170" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#19d3c5">▸ </tspan>Pioneered Kubernetes: infrastructure costs down 20%, GitOps with ArgoCD</text><text x="170" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#19d3c5">▸ </tspan>Authored Helm charts, Jenkins pipelines and a Terraform remote backend on AWS</text><text x="170" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#19d3c5">▸ </tspan>Integrated Kafka and the ELK Stack; mentored engineers on Kubernetes</text></g><g class="it" style="animation-delay:0.6s"><circle class="pulse" cx="86" cy="490" r="9" fill="#ff7ab6"/><circle cx="86" cy="490" r="16" fill="#ff7ab6" fill-opacity=".18" class="halo"/>
<rect x="130" y="462" width="1030" height="174" rx="20" fill="#111a3a" stroke="#ff7ab6" stroke-opacity="0.35"/>
