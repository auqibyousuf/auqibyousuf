<text x="170" y="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Frontend Developer / DevOps Engineer</text>
<text x="170" y="522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-style="italic" fill="#8e9ad6">Axelerant Technologies Private Limited</text><text x="170" y="558" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#ff7ab6">▸ </tspan>Led WordPress-to-Drupal migrations; built React and Next.js for B2B and B2C</text><text x="170" y="584" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#ff7ab6">▸ </tspan>Designed a shared Storybook library that sped up feature builds</text><text x="170" y="610" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#ff7ab6">▸ </tspan>Built WCAG-compliant interfaces and tuned LCP, CLS and INP</text></g><g class="it" style="animation-delay:0.8999999999999999s"><circle class="pulse" cx="86" cy="686" r="9" fill="#7c5cff"/><circle cx="86" cy="686" r="16" fill="#7c5cff" fill-opacity=".18" class="halo"/>
<rect x="130" y="658" width="1030" height="122" rx="20" fill="#111a3a" stroke="#7c5cff" stroke-opacity="0.35"/>
