<text x="170" y="718" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-style="italic" fill="#8e9ad6">CSIR – Indian Institute of Integrative Medicine</text><text x="170" y="754" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#c9d2ff"><tspan fill="#7c5cff">▸ </tspan>Supported web development and academic assistance within the institute</text></g><g class="it" style="animation-delay:1.2s"><circle class="pulse" cx="86" cy="830" r="9" fill="#19d3c5"/><circle cx="86" cy="830" r="16" fill="#19d3c5" fill-opacity=".18" class="halo"/>
