<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="994" viewBox="0 0 1200 994"><defs><linearGradient id="tl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset=".5" stop-color="#19d3c5"/><stop offset="1" stop-color="#ff7ab6"/></linearGradient></defs>
<style>.it{animation:in 1s cubic-bezier(.2,.8,.2,1) both}@keyframes in{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.line{stroke-dasharray:994;stroke-dashoffset:994;animation:dl 3.5s ease forwards}@keyframes dl{to{stroke-dashoffset:0}}
.pulse{animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.25)}}.pulse,.halo{transform-box:fill-box;transform-origin:center}
.halo{animation:ha 2.4s ease-out infinite}@keyframes ha{from{transform:scale(.6);opacity:.9}to{transform:scale(1.8);opacity:0}}</style>
<line class="line" x1="86" y1="20" x2="86" y2="974" stroke="url(#tl)" stroke-width="3" stroke-linecap="round" stroke-dasharray="994"/><g class="it" style="animation-delay:0.0s"><circle class="pulse" cx="86" cy="46" r="9" fill="#7c5cff"/><circle cx="86" cy="46" r="16" fill="#7c5cff" fill-opacity=".18" class="halo"/>
