<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs><radialGradient id="glow0" cx="0%" cy="0%" r="90%"><stop offset="0" stop-color="#7c5cff" stop-opacity=".22"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient><radialGradient id="glow1" cx="0%" cy="0%" r="90%"><stop offset="0" stop-color="#19d3c5" stop-opacity=".22"/><stop offset="1" stop-color="#19d3c5" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="0%" cy="0%" r="90%"><stop offset="0" stop-color="#ff7ab6" stop-opacity=".22"/><stop offset="1" stop-color="#ff7ab6" stop-opacity="0"/></radialGradient></defs>
<style>.card{animation:up .9s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.ic{stroke-dasharray:200;stroke-dashoffset:200;animation:dr 2.2s ease forwards 0.6s}@keyframes dr{to{stroke-dashoffset:0}}</style>
<g class="card" style="animation-delay:0.1s">
<rect x="40" y="30" width="360" height="240" rx="24" fill="#111a3a" stroke="#7c5cff" stroke-opacity=".35"/>
<rect x="40" y="30" width="360" height="240" rx="24" fill="url(#glow0)"/>
<g transform="translate(70 55)"><circle cx="30" cy="30" r="34" fill="#7c5cff" fill-opacity=".14"/><path d="M20 40 L40 20 L60 40 M30 40 L30 56 M50 40 L50 56" fill="none" stroke="#7c5cff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="ic"/></g>
<text x="350" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#7c5cff" text-anchor="end" opacity=".8">01</text>
<text x="70" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Interfaces</text>
<text x="70" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#aeb8e6">Pixel-accurate, accessible UI that</text><text x="70" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#aeb8e6">feels effortless. Design systems,</text><text x="70" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#aeb8e6">tokens and reusable components.</text>
</g><g class="card" style="animation-delay:0.35s">
<rect x="430" y="30" width="360" height="240" rx="24" fill="#111a3a" stroke="#19d3c5" stroke-opacity=".35"/>
<rect x="430" y="30" width="360" height="240" rx="24" fill="url(#glow1)"/>
<g transform="translate(460 55)"><circle cx="30" cy="30" r="34" fill="#19d3c5" fill-opacity=".14"/><path d="M26 18 h28 a6 6 0 0 1 6 6 v32 a6 6 0 0 1 -6 6 h-28 a6 6 0 0 1 -6 -6 v-32 a6 6 0 0 1 6 -6z M34 54 h12" fill="none" stroke="#19d3c5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="ic"/></g>
<text x="740" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#19d3c5" text-anchor="end" opacity=".8">02</text>
<text x="460" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Mobile + Web</text>
<text x="460" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#aeb8e6">One codebase, two worlds: React</text><text x="460" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#aeb8e6">Native and Expo for apps, React and</text><text x="460" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#aeb8e6">Drupal for the web.</text>
</g><g class="card" style="animation-delay:0.6s">
<rect x="820" y="30" width="360" height="240" rx="24" fill="#111a3a" stroke="#ff7ab6" stroke-opacity=".35"/>
<rect x="820" y="30" width="360" height="240" rx="24" fill="url(#glow2)"/>
<g transform="translate(850 55)"><circle cx="30" cy="30" r="34" fill="#ff7ab6" fill-opacity=".14"/><path d="M20 50 Q30 14 40 40 T60 28" fill="none" stroke="#ff7ab6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="ic"/></g>
<text x="1130" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#ff7ab6" text-anchor="end" opacity=".8">03</text>
<text x="850" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Motion + Polish</text>
<text x="850" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#aeb8e6">Micro-interactions, smooth</text><text x="850" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#aeb8e6">transitions and the small details</text><text x="850" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#aeb8e6">that make a product feel alive.</text>
</g></svg>