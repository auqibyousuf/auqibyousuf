<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1a40"/><stop offset="1" stop-color="#1a1250"/></linearGradient>
<linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#19d3c5"/><stop offset="1" stop-color="#ff7ab6"/></linearGradient>
<linearGradient id="peak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3d86"/><stop offset="1" stop-color="#101c44"/></linearGradient>
<clipPath id="c"><rect x="30" y="20" width="1140" height="340" rx="28"/></clipPath>
</defs>
<style>
.dash{stroke-dasharray:10 12;animation:dm 1.6s linear infinite}@keyframes dm{to{stroke-dashoffset:-44}}
.pin{animation:pin 2.4s ease-in-out infinite}@keyframes pin{50%{transform:translateY(-8px)}}
.ring{transform-origin:center;transform-box:fill-box;animation:ring 2.4s ease-out infinite}@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(2.4);opacity:0}}
.in{animation:in 1s cubic-bezier(.2,.8,.2,1) both}@keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.chip{animation:in 1s cubic-bezier(.2,.8,.2,1) both}
.glow{animation:gl 4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.5}to{opacity:1}}
</style>
<rect x="30" y="20" width="1140" height="340" rx="28" fill="url(#bg)" stroke="#7c5cff" stroke-opacity=".4"/>
<g clip-path="url(#c)">
<circle class="glow" cx="980" cy="100" r="200" fill="#7c5cff" fill-opacity=".18"/>
<path d="M560 360 L700 150 L770 250 L860 110 L990 300 L1060 220 L1180 360Z" fill="url(#peak)"/>
<path d="M560 360 L700 150 L725 190 L690 215 L700 190Z M860 110 L895 165 L860 150 L840 175Z" fill="#fff" fill-opacity=".85"/>
<path class="dash" d="M640 320 C720 300 700 230 780 230 S 900 290 960 230 S 1040 150 1100 170" fill="none" stroke="url(#route)" stroke-width="5" stroke-linecap="round"/>
<g transform="translate(1100 170)"><circle class="ring" r="14" fill="none" stroke="#ff7ab6" stroke-width="3"/><g class="pin"><path d="M0 -4 C-12 -22 -12 -40 0 -44 C12 -40 12 -22 0 -4Z" fill="#ff7ab6"/><circle cy="-30" r="5" fill="#fff"/></g></g>
</g>
<g class="in" style="animation-delay:.2s"><text x="80" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#6df0e4" letter-spacing="3">FEATURED PROJECT</text></g>
<g class="in" style="animation-delay:.35s"><text x="78" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" fill="#fff" letter-spacing="-1.5">GoKashmir</text></g>
<g class="in" style="animation-delay:.5s">
<text x="80" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c9d2ff">A travel super-app for Kashmir: a traveller app, a partner app</text>
<text x="80" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c9d2ff">and a FastAPI backend. One codebase, three roles.</text>
</g>
<g class="chip" style="animation-delay:0.7s"><rect x="80" y="258" width="120" height="38" rx="19" fill="#ffffff" fill-opacity=".08" stroke="#fff" stroke-opacity=".2"/><text x="140.0" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Expo / RN</text></g><g class="chip" style="animation-delay:0.82s"><rect x="212" y="258" width="118" height="38" rx="19" fill="#ffffff" fill-opacity=".08" stroke="#fff" stroke-opacity=".2"/><text x="271.0" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">TypeScript</text></g><g class="chip" style="animation-delay:0.94s"><rect x="342" y="258" width="100" height="38" rx="19" fill="#ffffff" fill-opacity=".08" stroke="#fff" stroke-opacity=".2"/><text x="392.0" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">FastAPI</text></g><g class="chip" style="animation-delay:1.06s"><rect x="454" y="258" width="110" height="38" rx="19" fill="#ffffff" fill-opacity=".08" stroke="#fff" stroke-opacity=".2"/><text x="509.0" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Postgres</text></g>
</svg>