<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
<defs>
<linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#19d3c5"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b8a8ff"/></linearGradient>
</defs>
<style>.w1{animation:w 9s ease-in-out infinite alternate}.w2{animation:w 13s ease-in-out infinite alternate-reverse}@keyframes w{from{transform:translateX(-80px)}to{transform:translateX(80px)}}
.pulse{animation:pl 2.6s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.04)}}</style>
<g class="w2"><path d="M-100 150 C 150 100 350 200 600 150 S 1050 100 1300 150 L1300 260 L-100 260Z" fill="#1a1250" fill-opacity=".8"/></g>
<g class="w1"><path d="M-100 175 C 200 130 400 220 650 175 S 1050 140 1300 180 L1300 260 L-100 260Z" fill="url(#w1)" fill-opacity=".35"/></g>
<text x="600" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" fill="url(#t)" text-anchor="middle" letter-spacing="-1">Let's build something beautiful.</text>
<text x="600" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#6df0e4" text-anchor="middle" letter-spacing="2">OPEN TO INTERESTING WORK</text>
</svg>